name: Build signed Mac draft from verified release input
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release containing release-input.tar.gz
        required: true
        default: v0.3.4
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Download prepared release input
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern release-input.tar.gz
          tar -xzf release-input.tar.gz
      - name: Recover unchanged public media and verify every image
        working-directory: desktop-app
        run: |
          node <<'JS'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const hashes=JSON.parse(fs.readFileSync('media-hashes.json'));
          const queue=Object.entries(hashes);
          async function worker(){while(queue.length){const [name,hash]=queue.shift();const file=path.join('web',name);if(!fs.existsSync(file)){const r=await fetch('https://open-your-life.vercel.app/app/'+name);if(!r.ok)throw new Error(name+' HTTP '+r.status);fs.mkdirSync(path.dirname(file),{recursive:true});fs.writeFileSync(file,Buffer.from(await r.arrayBuffer()));}if(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')!==hash)throw new Error('Image differs from approved build: '+name);}}
          Promise.all(Array.from({length:8},worker)).then(()=>console.log('All images match approved release')).catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - name: Install build dependencies
        working-directory: desktop-app
        run: npm ci
      - name: Require signing inputs
        working-directory: desktop-app
        run: node scripts/release-preflight.cjs
      - name: Build and verify both signed Mac installers
        working-directory: desktop-app
        run: |
          ./node_modules/.bin/electron-builder --mac dmg --arm64 --x64
          node scripts/verify-public-release.cjs
      - name: Upload verified assets to draft only
        working-directory: desktop-app/release
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          shasum -a 256 Life-OS-mac-arm64.dmg Life-OS-mac-intel.dmg > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber Life-OS-mac-arm64.dmg Life-OS-mac-intel.dmg SHA256SUMS.txt RELEASE-VERIFICATION.json
          echo 'Keep this release draft until clean-Mac browser download and installation tests pass.'
